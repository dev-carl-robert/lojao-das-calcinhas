<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojão das Calcinhas</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="../src/image/logo.png" alt="Lojão das Calcinhas Logo">
            </div>
            
            <div class="busca_submit">
                <input type="text" placeholder="O que você procura?">
                <button type="submit"><i class="bi bi-search"></i></button>
            </div>

            <div class="icons">
                <i id="login" class="bi bi-person">login</i>
                <i id="compras" class="bi bi-cart-plus-fill">R$ 0,00</i>
            </div>
        </div>
    </header>

    <div class="categorias">
        <div class="categorias-lista">
            <div class="categoria-item ativado"><a href="#">Calcinhas</a></div>
            <div class="categoria-item"><a href="#">Sutiã</a></div>
            <div class="categoria-item"><a href="#">Conjuntos</a></div>
            <div class="categoria-item"><a href="#">Camisola</a></div>
            <div class="categoria-item"><a href="#">Pijama</a></div>
        </div>
    </div>

    <main>

        <div class="container-produtos">
            <div class="produtos">
                <div class="produto-item">
                    <img src="../src/image/calcinha.jpg" alt="Produto 1">
                    <h3>Calcinha Renda</h3>
                    <p class="precos">R$ 29,90</p>
                </div>
                <div class="produto-item">
                    <img src="../src/image/calcinha.jpg" alt="Produto 2">
                    <h3>Calcinha Algodão</h3>
                    <p class="precos">R$ 19,90</p>
                </div>
                <div class="produto-item">
                    <img src="../src/image/calcinha.jpg" alt="Produto 3">
                    <h3>Sutiã Renda</h3>
                    <p class="precos">R$ 39,90</p>
                </div>
                <div class="produto-item">
                    <img src="../src/image/calcinha.jpg" alt="Produto 3">
                    <h3>Sutiã Renda</h3>
                    <p class="precos">R$ 39,90</p>
                </div>
                <!-- Adicione mais produtos conforme necessário -->
            </div>
        </div>
    </main>

</body>
</html>
